# iOS e2e on a GitHub-hosted macOS runner.
#
# This is a separate workflow rather than a job inside go.yml because it
# is the only one needing a macOS runner: the image is slower to
# schedule, the suite is minutes rather than seconds, and keeping it out
# of the Go workflow means a queued macOS runner never delays the Linux
# feedback loop. GitHub-hosted macOS runners are free for public
# repositories, which is what makes this affordable at all.
#
# The suites need no mock server: e2e/ios/** drives the demo app only.
name: iOS

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

# A macOS runner costs minutes and wall-clock; superseded pushes on the
# same ref have nothing left to prove.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS e2e
    # macos-26 is arm64 and ships Xcode 26.6 as its default, matching the
    # toolchain the suites are developed against. Pinned rather than
    # macos-latest so an image promotion cannot silently move Xcode, the
    # iOS runtime, and therefore the driver cache key underneath us.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      # Keeping the embedded-driver cache inside the workspace makes it
      # both cacheable by path and uploadable as an artifact without
      # guessing the runner's home directory.
      TALES_DRIVER_CACHE_DIR: ${{ github.workspace }}/.cache/tales/apple-driver

      # Read by the driver block of every e2e/ios suite. The 30s default
      # is a developer-machine number: on this runner a single
      # XCUIApplication.launch() has been measured at 4.8s, 9.2s, 32.7s
      # and once 245s, while taps and hierarchy fetches stayed at their
      # local speed. Abandoning a launch the driver goes on to finish
      # desynchronizes the two sides, and every later scenario then fails
      # against a driver that is still working on the previous one — so
      # the ceiling is raised rather than the failure absorbed.
      TALES_DRIVER_TIMEOUT: 300s

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The suites resolve their simulator by exact name (see
      # simctl.FindDeviceByName), so an image that drops "iPhone 17"
      # would fail deep inside the run. Resolve it up front and fall
      # back to the newest available iPhone instead.
      - name: Select an iOS simulator
        id: simulator
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re, subprocess, sys

          preferred = os.environ.get("IOS_DEVICE_NAME") or "iPhone 17"

          raw = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout

          def runtime_version(identifier):
              match = re.search(r"iOS-(\d+)-(\d+)", identifier)
              return (int(match.group(1)), int(match.group(2))) if match else (0, 0)

          # name -> (newest iOS runtime, the UDID Tales would select on it)
          available = {}
          for identifier, devices in json.loads(raw).get("devices", {}).items():
              if "iOS" not in identifier:
                  continue
              version = runtime_version(identifier)
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name, udid = device["name"], device["udid"]
                  current = available.get(name)
                  # Newest runtime wins, lowest UDID breaks a tie: the
                  # same order simctl.preferredOver applies in Go.
                  if current is None or version > current[0] or (version == current[0] and udid < current[1]):
                      available[name] = (version, udid)

          if not available:
              sys.exit("no available iOS simulator on this runner")

          if preferred in available:
              chosen = preferred
          else:
              iphones = [name for name in available if name.startswith("iPhone")]
              if not iphones:
                  sys.exit(f"no iPhone simulator available (have: {sorted(available)})")

              plain = re.compile(r"^iPhone (\d+)$")

              def rank(name):
                  match = plain.match(name)
                  return (bool(match), int(match.group(1)) if match else 0, available[name][0])

              chosen = max(iphones, key=rank)
              print(f"::warning::simulator {preferred!r} unavailable, using {chosen!r}", file=sys.stderr)

          print(f"device={chosen}")
          print(f"udid={available[chosen][1]}")
          PY

      # Booting here rather than letting the first scenario do it keeps
      # simulator startup out of the suite's own timings, and gives the
      # first app launch a settled device. The UDID matches what Tales
      # will select: same "newest iOS runtime, then lowest UDID" order,
      # and Tales prefers an already-booted device on a tie.
      - name: Boot the simulator
        run: xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b

      # The embedded Swift driver is built once per (source, Xcode, SDK,
      # runtime, macOS) tuple and reused from the cache afterwards. The
      # runtime key is finer-grained than this one; a restored cache that
      # no longer matches is simply ignored, never wrongly reused.
      #
      # restore + save rather than the combined action: the combined
      # action's post step only saves when the job succeeded, so a run
      # that failed *after* building the driver saved nothing and the
      # next attempt paid the build again — exactly when iterating on a
      # red build makes the cache most valuable.
      - name: Restore the embedded driver build
        id: driver-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tales/apple-driver
          key: apple-driver-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('drivers/apple/**') }}
          restore-keys: |
            apple-driver-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-

      - name: iOS e2e
        run: make e2e-ios
        env:
          IOS_DEVICE_NAME: ${{ steps.simulator.outputs.device }}
        timeout-minutes: 40

      - name: iOS e2e failure
        run: make e2e-ios-failure
        env:
          IOS_DEVICE_NAME: ${{ steps.simulator.outputs.device }}
        timeout-minutes: 20

      # Guarded on the exact-key miss: saving a key that already exists
      # is an error, and a restore-keys prefix hit still leaves the exact
      # key unwritten, which is precisely the case worth saving.
      - name: Save the embedded driver build
        if: always() && steps.driver-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/tales/apple-driver
          key: apple-driver-${{ runner.os }}-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('drivers/apple/**') }}

      - name: Diagnostics
        if: failure()
        run: |
          make doctor-ios || true
          ./build/tales doctor --json || true

      - name: Upload iOS e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-artifacts
          path: |
            build/reports/e2e-ios*.*
            build/artifacts/mobile/
            .cache/tales/apple-driver/*/logs/
          if-no-files-found: ignore
