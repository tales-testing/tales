name: Go

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - 'README.md'
      - 'CLAUDE.md'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tales
          POSTGRES_PASSWORD: tales
          POSTGRES_DB: tales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tales -d tales"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: tales
          MYSQL_DATABASE: tales
          MYSQL_USER: tales
          MYSQL_PASSWORD: tales
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -utales -ptales --silent"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      POSTGRES_DSN: postgres://tales:tales@127.0.0.1:5432/tales?sslmode=disable
      MYSQL_DSN: tales:tales@tcp(127.0.0.1:3306)/tales?parseTime=true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -race -v ./...

      - name: Test
        run: go test -race -cover -coverprofile ./coverage.out ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=300s

      - name: E2E
        run: make e2e

      # Browser e2e: ubuntu-latest runners ship Google Chrome stable
      # pre-installed in /usr/bin/google-chrome, which our
      # `make check-chrome` resolves automatically. No extra setup step
      # required. The target itself skips with exit 0 if Chrome is not
      # found, so removing the runner image's Chrome (or running on a
      # different OS) does not fail the job.
      #
      # timeout-minutes is a hard cap on the step in case Chrome or the
      # mockserver hangs in a way the inner --timeout cannot break out
      # of. The expected runtime is well under 30s on ubuntu-latest.
      - name: E2E browser
        run: make e2e-browser
        env:
          # Verbose chromedp + provider trace so a future hang shows
          # exactly which action / PID / user-data-dir is involved.
          # Cheap (only writes to stderr when enabled), removable later.
          TALES_BROWSER_DEBUG: "1"
        timeout-minutes: 5

      - name: E2E browser failure
        run: make e2e-browser-failure
        env:
          TALES_BROWSER_DEBUG: "1"
        timeout-minutes: 3

      - name: Upload browser e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-artifacts
          path: |
            build/reports/e2e-browser.*
            build/artifacts/browser/
          if-no-files-found: ignore

      # - name: Coveralls
      #  uses: shogo82148/actions-goveralls@v1
      #  with:
      #    path-to-profile: coverage.out

  # The Android e2e suite runs on a real emulator: ubuntu-latest supports
  # KVM, which makes an emulator both possible and fast enough to gate
  # merges on. The iOS suites need a macOS runner and live in their own
  # workflow (.github/workflows/ios.yml).
  android:
    name: Android e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # AGP 8.13 requires JDK 17 and does not run on newer majors, so the
      # version is pinned rather than tracking the runner's default.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the demo app
        run: make build-android-demo

      - name: Android e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: tales-e2e
          # Snapshots are disabled: a snapshot restores whatever app and
          # driver state the previous boot had, and these scenarios
          # assume a clean device.
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # hide_error_dialogs suppresses the system "isn't responding"
          # and "has stopped" modals. A run was lost to a Pixel Launcher
          # ANR: the emulator's own launcher stopped responding under the
          # runner's load, and the resulting dialog sat above the app
          # under test. Every scenario then failed its first wait_visible
          # while the captured hierarchy held nothing but system UI — a
          # dialog belonging to a process Tales never touches, reported
          # as a missing element in the app.
          #
          # It hides our own app's crash dialogs too, which is a real
          # (small) diagnostic loss: an app that dies still shows up as
          # missing elements plus a screenshot, just without the modal
          # naming it.
          script: |
            adb shell settings put global hide_error_dialogs 1
            make e2e-android && make e2e-android-failure
        timeout-minutes: 30

      - name: Upload Android e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-artifacts
          path: |
            build/reports/e2e-android*.*
            build/artifacts/mobile/
          if-no-files-found: ignore

  # Guards the committed driver APKs against drifting from the Kotlin
  # source they were built from. Verifying is a hash comparison, so this
  # job needs the Android SDK only because Gradle computes the hash.
  android-driver-freshness:
    name: Android driver freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the prebuilt driver matches its source
        run: make check-android-driver-fresh
